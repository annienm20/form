<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="lamp-part" data-tooltip="This is your helpful tooltip text!">
            <div class="rectangle-shape"></div>
            <div class="triangle-shape"></div>
            <div class="circle-shape"></div>
           
        </section>
        <section class="content-container">
            <form>
                  <h1>form</h1>
                  <div class="name-info">
                  <label for="first-name">first name</label>
                  <input type="text" name="" id="first-name" required>
                  <label for="last-name">last name</label>
                  <input type="text" name="" id="last-name" required></div>
                  <div class="emailandphoneinfo">
                    <label for="email-info">e-mail</label>
                  <input type="email" name="" id="email-info" required>
                   <label for="phone-info">moblie number</label>
                  <input type="tel" name="" id="phone-info" required>
                  </div><div class="gender-info">
                  <h3>gender</h3>
                  <div class="radio-btn">
                  <label for="male">male</label>
                  <input type="radio" name="gender" id="male" value="male">
                  <label for="female">female</label>
                  <input type="radio" name="gender" id="female" value="female"></div></div>
                  <input type="submit">
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
